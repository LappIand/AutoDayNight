# AutoDayNight public defaults. First launch opens Location settings.
# No city is assumed; configure the location through the tray menu.
location_configured=0
city=
lat=0
lon=0
# Empty = follow Windows time zone; or use a Windows ID, e.g. China Standard Time.
time_zone=
auto=1
# Positive = later; negative = earlier. Range: -180..180 minutes.
sunrise_offset_min=0
sunset_offset_min=0
# Opt-in: below threshold ON BATTERY shows a prompt; no response may shut down.
low_batt_alert=0
low_batt_percent=20
low_batt_grace_sec=60
